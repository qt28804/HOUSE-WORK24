<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài liệu - HOUSE WORK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/ui.css">
    <link rel="stylesheet" href="../css/tai-lieu.css">
</head>
<body>

    <!-- Navigation -->
    <div class="nav-wrapper">
        <nav class="navbar" id="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <div class="nav-logo-icon"><i class="fas fa-microchip"></i></div>
                    <span>HOUSE WORK</span>
                </div>
                <ul class="nav-menu" id="navMenu">
                    <li class="nav-item"><a href="../index.html" class="nav-link">Trang chủ</a></li>
                    <li class="nav-item active"><a href="tai-lieu.html" class="nav-link">Tài liệu</a></li>
                    <li class="nav-item"><a href="thu-vien.html" class="nav-link">Thư viện</a></li>
                    <li class="nav-item"><a href="test.html" class="nav-link">Kiểm tra</a></li>
                    <li class="nav-item"><a href="tien-do.html" class="nav-link">Tiến độ</a></li>
                    <li class="nav-item"><a href="am-nhac.html" class="nav-link"><i class="fas fa-music" style="color:#f093fb;margin-right:.3rem"></i>Âm nhạc</a></li>
                </ul>
                <div class="hamburger" id="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
        <div id="navAuthArea"></div>
    </div>

    <div class="page-content">

    <!-- Hero -->
    <section class="docs-hero">
        <div class="container">
            <div class="docs-hero-content">
                <h1 class="docs-hero-title">
                    <i class="fas fa-book-open"></i> Kho tài liệu học tập
                </h1>
                <p class="docs-hero-desc">
                    Tài liệu đầy đủ các môn học — Toán, Lý, Hóa, Tin, Sử, Công nghệ, Tiếng Anh
                </p>
                <div class="docs-search">
                    <i class="fas fa-search" style="color:#a0aec0;margin-right:.6rem;flex-shrink:0"></i>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm tài liệu, đề thi...">
                    <button class="search-btn" onclick="searchDocs()">Tìm kiếm</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Subject Tab Bar -->
    <div class="subject-tab-bar">
        <div class="container">
            <div class="subject-tab-inner" id="subjectTabInner">
                <div class="tab-indicator" id="tabIndicator"></div>
                <button class="subject-tab-btn active" data-subject="tat-ca" onclick="switchSubject(this,'tat-ca')">
                    <i class="fas fa-th tab-icon"></i> Tất cả
                </button>
                <button class="subject-tab-btn" data-subject="toan" onclick="switchSubject(this,'toan')">
                    <i class="fas fa-square-root-alt tab-icon"></i> Toán
                </button>
                <button class="subject-tab-btn" data-subject="ly" onclick="switchSubject(this,'ly')">
                    <i class="fas fa-atom tab-icon"></i> Vật lý
                </button>
                <button class="subject-tab-btn" data-subject="hoa" onclick="switchSubject(this,'hoa')">
                    <i class="fas fa-flask tab-icon"></i> Hóa học
                </button>
                <button class="subject-tab-btn" data-subject="tin" onclick="switchSubject(this,'tin')">
                    <i class="fas fa-laptop-code tab-icon"></i> Tin học
                </button>
                <button class="subject-tab-btn" data-subject="su" onclick="switchSubject(this,'su')">
                    <i class="fas fa-landmark tab-icon"></i> Lịch sử
                </button>
                <button class="subject-tab-btn" data-subject="cong-nghe" onclick="switchSubject(this,'cong-nghe')">
                    <i class="fas fa-cogs tab-icon"></i> Công nghệ
                </button>
                <button class="subject-tab-btn" data-subject="tieng-anh" onclick="switchSubject(this,'tieng-anh')">
                    <i class="fas fa-language tab-icon"></i> Tiếng Anh
                </button>
                <button class="subject-tab-btn" data-subject="tong-de" onclick="switchSubject(this,'tong-de')">
                    <i class="fas fa-file-alt tab-icon"></i> Tổng đề
                </button>
            </div>
        </div>
    </div>

    <!-- Main layout: sidebar + content -->
    <div class="docs-layout">

        <!-- Sidebar -->
        <nav class="docs-sidebar" id="sidebar"></nav>

        <!-- Content -->
        <main class="docs-content">
            <div class="content-header">
                <div>
                    <h2 id="contentTitle">Tất cả tài liệu</h2>
                    <p id="contentDesc">Tổng hợp tài liệu tất cả các môn học</p>
                </div>
                <select class="sort-select" id="sortSelect">
                    <option value="newest">Mới nhất</option>
                    <option value="popular">Phổ biến nhất</option>
                    <option value="az">A → Z</option>
                </select>
            </div>

            <div class="docs-grid" id="docsGrid"></div>
            <div class="no-results" id="noResults">
                <i class="fas fa-search"></i>
                <p>Không tìm thấy tài liệu phù hợp.</p>
            </div>
        </main>
    </div>

    </div><!-- /.page-content -->

    <!-- File viewer modal — ngoài page-content để tránh bị lệch bởi transform -->
    <div class="file-modal" id="fileModal">
        <div class="file-modal-inner">
            <div class="file-modal-header">
                <h3 id="modalFileName">Tài liệu</h3>
                <div class="file-modal-actions">
                    <button class="btn-modal-action btn-modal-download" onclick="downloadCurrentFile()">
                        <i class="fas fa-download"></i> Tải xuống
                    </button>
                    <button class="btn-modal-action btn-modal-close" onclick="closeFileModal()">
                        <i class="fas fa-times"></i> Đóng
                    </button>
                </div>
            </div>
            <iframe id="fileViewer" title="Xem tài liệu"></iframe>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/tai-lieu.js"></script>
</body>
</html>
