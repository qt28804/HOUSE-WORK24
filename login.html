<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - HOUSE WORK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <!-- Ambient background orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- Login card -->
    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">
            <div class="login-logo-icon"><i class="fas fa-microchip"></i></div>
        </div>

        <h1 class="login-title">Đăng nhập vào<br><span>HOUSE WORK</span></h1>
        <p class="login-sub">Truy cập kho tài liệu học tập của bạn</p>

        <!-- Role tabs -->
        <div class="role-tabs">
            <button class="role-tab active" id="tabStudent" onclick="switchRole('student')">
                <i class="fas fa-user-graduate"></i> Học sinh
            </button>
            <button class="role-tab" id="tabAdmin" onclick="switchRole('admin')">
                <i class="fas fa-user-shield"></i> Admin
            </button>
        </div>

        <!-- Error -->
        <div class="error-msg" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Tên đăng nhập hoặc mật khẩu không đúng.</span>
        </div>

        <!-- Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <div class="input-wrap">
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập..." autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-pw" onclick="togglePassword()" tabindex="-1">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <label class="remember">
                    <input type="checkbox" id="rememberMe"> Ghi nhớ đăng nhập
                </label>
                <a href="#" class="forgot">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-login-text">ĐĂNG NHẬP</span>
                <div class="btn-login-glow"></div>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider"><span>HOẶC</span></div>

        <!-- Social buttons -->
        <div class="social-btns">
            <button class="btn-social btn-google" id="btnGoogle" onclick="loginWithGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span>Google</span>
            </button>
            <button class="btn-social btn-github" onclick="alert('Chức năng đang phát triển')">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </button>
        </div>

        <!-- Google One Tap (ẩn, tự kích hoạt khi GSI load) -->
        <div id="g_id_onload"
             data-client_id="534748116389-44busaj78tdfghad5hbur4kbffveu0ps.apps.googleusercontent.com"
             data-callback="handleGoogleCredential"
             data-auto_prompt="false"
             data-cancel_on_tap_outside="false">
        </div>

        <!-- Footer links -->
        <div class="login-footer">
            <a href="#">Điều khoản sử dụng</a>
            <span>|</span>
            <a href="#">Chính sách bảo mật</a>
        </div>
    </div>

    <!-- Page transition loader -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-content">
            <div class="loader-logo">
                <div class="loader-logo-icon"><i class="fas fa-microchip"></i></div>
                <span>HOUSE WORK</span>
            </div>
            <div class="loader-spinner">
                <svg viewBox="0 0 50 50" class="loader-ring">
                    <circle cx="25" cy="25" r="20" fill="none" stroke-width="3"/>
                </svg>
            </div>
            <p class="loader-text" id="loaderText">Đang tải...</p>
        </div>
    </div>

    <!-- Supabase SDK — load trước login.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
